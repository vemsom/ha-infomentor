# Exempel: notis med hela meddelandet, uppdelat i delar
#
# Android kapar en notis vid ungefär 285 tecken, även när den är expanderad.
# Den här automationen skickar därför hela meddelandet i delar om högst
# 250 tecken, delade vid ordgräns, och numrerar dem (1/3), (2/3), (3/3).
#
# Delarna skickas i omvänd ordning — sista delen först — eftersom Android
# lägger den senast skickade notisen överst i listan. Då hamnar del 1 överst
# och man läser uppifrån och ner.
#
# Byt ut:
#   sensor.DITT_BARN_OLASTA_SKOLHANDELSER  -> din sensor
#   notify.mobile_app_DIN_TELEFON          -> din notifieringstjänst
#   /lovelace/skola                        -> sidan som ska öppnas vid tryck
#
# Bara det nyaste meddelandet skickas, och bara om det är högst tre timmar
# gammalt — en gammal post som blir oläst igen skickar ingen notis.

alias: Skolan - hela meddelandet i delar
description: Skickar hela skolmeddelandet även när Android kapar texten.
mode: queued
max: 5

trigger:
  - trigger: state
    entity_id: sensor.DITT_BARN_OLASTA_SKOLHANDELSER

condition:
  - condition: template
    value_template: >-
      {% set m = (state_attr('sensor.DITT_BARN_OLASTA_SKOLHANDELSER', 'notifications') or [])
                 | selectattr('type', 'eq', 'MessageCreated')
                 | selectattr('body')
                 | selectattr('sent_at')
                 | sort(attribute='sent_at', reverse=true) | list %}
      {{ m and (as_timestamp(now()) - as_timestamp((m | first).sent_at)) < 10800 }}

variables:
  # Allt som behövs för notisen räknas ut en gång och packas som JSON, så att
  # delarna kan plockas ut ett index i taget i repeat-loopen.
  packet: >-
    {%- set m = (state_attr('sensor.DITT_BARN_OLASTA_SKOLHANDELSER', 'notifications') or [])
               | selectattr('type', 'eq', 'MessageCreated')
               | selectattr('body')
               | selectattr('sent_at')
               | sort(attribute='sent_at', reverse=true) | list -%}
    {%- set amne = ((m | first).subject | trim) if m and (m | first).subject else '' -%}
    {%- set body = ((m | first).body | trim) if m else '' -%}
    {%- set ns = namespace(delar=[], rad='') -%}
    {%- for ord in body.split(' ') -%}
    {%- if ns.rad and ((ns.rad ~ ' ' ~ ord) | length) > 250 -%}
    {%- set ns.delar = ns.delar + [ns.rad] -%}{%- set ns.rad = ord -%}
    {%- else -%}{%- set ns.rad = ((ns.rad ~ ' ' ~ ord) | trim) -%}
    {%- endif -%}
    {%- endfor -%}
    {%- if ns.rad -%}{%- set ns.delar = ns.delar + [ns.rad] -%}{%- endif -%}
    {%- set delar = ns.delar if ns.delar else [''] -%}
    {{ {'amne': (amne if amne else 'Meddelande från skolan'), 'antal': delar | length, 'delar': delar} | tojson }}

action:
  # Omvänd ordning: sista delen först, del 1 sist.
  - repeat:
      count: "{{ (packet | from_json).antal }}"
      sequence:
        - variables:
            del: "{{ (packet | from_json).antal - repeat.index + 1 }}"
        - action: notify.mobile_app_DIN_TELEFON
          data:
            title: >-
              {{ (packet | from_json).amne
                 ~ (' (' ~ del ~ '/' ~ (packet | from_json).antal ~ ')'
                    if (packet | from_json).antal > 1 else '') }}
            message: "{{ (packet | from_json).delar[del - 1] }}"
            data:
              url: /lovelace/skola
              clickAction: /lovelace/skola
        - delay: "00:00:01"

# iOS staplar notiser med den nyaste nederst, så där blir läsordningen rätt om
# delarna skickas i vanlig ordning. Använder du en iPhone byter du ut raden
# "del: (packet | from_json).antal - repeat.index + 1" mot
# "del: repeat.index".
